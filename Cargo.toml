[package]
name = "astra-backend"
version = "0.1.0"
edition = "2021"
authors = ["Astra Team"]

[dependencies]
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0.21"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
syn = { version = "3.0.9", features = ["full", "visit"] }
quote = "1.0"
ignore = "0.4"
reqwest = { version = "0.13.5", features = ["json"] }